services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: devrolebot
      POSTGRES_PASSWORD: devrolebot
      POSTGRES_DB: devrolebot
    volumes:
      - "postgresdata:/var/lib/postgresql/data/"
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "log_statement=all"]
volumes:
  postgresdata:
    driver: local
